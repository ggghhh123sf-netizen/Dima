<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Dima Messenger</title>

<style>
:root{
--bg:#0b1020;
--panel:#121a2d;
--panel2:#1a2540;
--blue:#397bff;
--text:#f1f5ff;
--muted:#91a0bd;
--border:#293653;
--green:#39df9a
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;
background:radial-gradient(ellipse at top,#17264a,var(--bg) 55%);
color:var(--text);
font-family:system-ui,Arial,sans-serif
}
button,input{font:inherit}
button{
border:0;cursor:pointer;border-radius:12px;padding:11px 14px
}
button:disabled{opacity:.55;cursor:wait}
input{
min-width:0;width:100%;padding:12px;
border-radius:12px;background:#0d1528;
color:white;border:1px solid var(--border)
}
.primary{
background:linear-gradient(135deg,#4d8cff,#2861e8);
color:white;font-weight:650
}
.secondary{
background:var(--panel2);color:white;
border:1px solid var(--border)
}
.app{max-width:1100px;margin:auto;padding:18px}
.panel{
background:rgba(18,26,45,.96);
border:1px solid var(--border);
border-radius:18px;padding:18px
}
.hidden{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3,p{margin-top:0}
.auth{max-width:420px;margin:8vh auto}
.auth input{margin:6px 0 12px}
.auth-actions{display:flex;gap:10px}
.auth-actions button{flex:1}
.error{color:#ff9da8;margin-top:12px;overflow-wrap:anywhere}
.top{
display:flex;justify-content:space-between;
align-items:center;gap:12px;margin-bottom:16px
}
.layout{
display:grid;grid-template-columns:260px minmax(0,1fr);
gap:16px
}
.people{display:flex;flex-direction:column;gap:8px}
.person{
display:flex;align-items:center;gap:10px;
width:100%;text-align:left;background:var(--panel2);
color:white;border:1px solid var(--border)
}
.avatar{
width:42px;height:42px;border-radius:50%;
display:grid;place-items:center;background:#263759;
font-size:23px;flex-shrink:0
}
.status{font-size:12px;color:var(--green)}
.chat{display:flex;flex-direction:column;min-height:65vh}
.chat-head{
display:flex;align-items:center;gap:10px;
padding-bottom:14px;border-bottom:1px solid var(--border)
}
.messages{
flex:1;min-height:250px;max-height:55vh;
overflow-y:auto;padding:14px 0;
display:flex;flex-direction:column;gap:10px
}
.message{
max-width:85%;padding:10px 13px;
border-radius:14px;background:var(--panel2);
overflow-wrap:anywhere
}
.message.mine{align-self:flex-end;background:#2453a7}
.message small{
display:block;color:#c1cce2;
font-size:11px;margin-bottom:4px
}
.message img{
display:block;
max-width:240px;
max-height:300px;
width:auto;
height:auto;
object-fit:contain;
border-radius:12px;
margin-top:6px;
cursor:pointer
}
.composer{
display:flex;gap:8px;padding-top:10px;
border-top:1px solid var(--border);
align-items:center
}
.composer input[type="text"]{flex:1}
.photo-label{
display:grid;
place-items:center;
cursor:pointer;
min-width:46px;
height:46px;
font-size:22px;
padding:8px
}
#photoInput{display:none}
.profile{
display:flex;align-items:center;gap:12px;margin-bottom:15px
}
#emojiPicker{
display:flex;gap:6px;flex-wrap:wrap;margin:10px 0
}
#emojiPicker button{
font-size:23px;padding:6px;background:var(--panel2)
}
#photoPreview{
max-width:120px;
max-height:100px;
border-radius:10px;
margin-top:8px
}
.photo-viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:1000;
display:none;
align-items:center;
justify-content:center;
padding:15px
}
.photo-viewer.active{display:flex}
.photo-viewer img{
max-width:100%;
max-height:90vh;
object-fit:contain
}
.photo-viewer button{
position:absolute;
top:15px;
right:15px;
font-size:22px;
background:#263759;
color:white
}
@media(max-width:680px){
.app{padding:10px}
.layout{grid-template-columns:1fr}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.person{padding:8px}
.person .avatar{width:34px;height:34px;font-size:19px}
.chat{min-height:55vh}
.messages{max-height:45vh}
.top{align-items:flex-start}
.composer{gap:5px}
.composer button{padding:10px}
}
</style>
</head>

<body>

<div class="app">

<section id="authPanel" class="panel auth">
<h1>Dima Messenger</h1>
<p class="muted">Войди или создай аккаунт</p>

<label for="email">Электронная почта</label>
<input id="email" type="email" autocomplete="email" placeholder="name@example.com">

<label for="password">Пароль</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Не менее 6 символов">

<div class="auth-actions">
<button id="login" type="button" class="primary">Войти</button>
<button id="register" type="button" class="secondary">Регистрация</button>
</div>

<div id="authError" class="error"></div>
</section>

<section id="messenger" class="hidden">

<header class="top">
<div>
<h1>Dima Messenger</h1>
<div class="muted">Твой чат</div>
</div>
<button id="logout" type="button" class="secondary">Выйти</button>
</header>

<div class="layout">

<aside class="panel">

<h2>Профиль</h2>

<div class="profile">
<div id="myAvatar" class="avatar">🙂</div>

<div style="min-width:0;flex:1">
<input id="myName" maxlength="30" placeholder="Твоё имя">
<div id="myEmail" class="muted" style="font-size:12px;margin-top:6px;overflow-wrap:anywhere"></div>
</div>
</div>

<div id="emojiPicker"></div>

<button id="saveProfile" type="button" class="primary">Сохранить профиль</button>
<div id="profileError" class="error"></div>

<hr style="border-color:var(--border);margin:18px 0">

<h2>Люди</h2>

<div id="people" class="people">
<p class="muted">Загрузка пользователей…</p>
</div>

</aside>

<main class="panel chat">

<div class="chat-head">
<div id="chatAvatar" class="avatar">🌐</div>
<div>
<h2 id="chatTitle" style="margin-bottom:3px">Общий чат</h2>
<div id="chatSubtitle" class="muted">Сообщения для всех</div>
</div>
</div>

<div id="messages" class="messages">
<p class="muted">Загрузка сообщений…</p>
</div>

<div id="chatError" class="error"></div>

<form id="composer" class="composer">

<label for="photoInput" class="secondary photo-label" title="Отправить фотографию">📷</label>

<input
id="photoInput"
type="file"
accept="image/*"
>

<input
id="messageInput"
type="text"
maxlength="2000"
autocomplete="off"
placeholder="Напиши сообщение…"
>

<button id="send" type="submit" class="primary">Отправить</button>

</form>

<img id="photoPreview" class="hidden" alt="Предпросмотр фотографии">

</main>

</div>
</section>
</div>

<div id="photoViewer" class="photo-viewer">
<button id="closeViewer" type="button">✕</button>
<img id="viewerImage" alt="Фотография">
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
limit,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getDatabase,
ref,
set,
onValue,
onDisconnect,
serverTimestamp as rtdbTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
getStorage,
ref as storageRef,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
apiKey: "AIzaSyDpm_WzeaUue17urrQptihWbQQtWEOBp3U",
authDomain: "dima-messenger.firebaseapp.com",
databaseURL: "https://dima-messenger-default-rtdb.firebaseio.com",
projectId: "dima-messenger",
storageBucket: "dima-messenger.firebasestorage.app",
messagingSenderId: "205525066127",
appId: "1:205525066127:web:b44470d06e4e5ccb21abfa",
measurementId: "G-8HP9CRT76R"
};


/* INITIALIZATION */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);

const emojis = ["🙂","😎","🐱","🐸","🦊","🐼","👻","🤖","🐺","🔥","⭐","💎"];

let currentUser = null;
let myProfile = {name:"",avatar:"🙂"};
let selectedUser = null;
let profiles = {};
let stopMessages = null;
let stopProfiles = null;
let stopPresence = null;
let selectedEmoji = "🙂";


/* ERRORS */

function showError(id,message=""){
$(id).textContent = message;
}

function friendlyError(error){

const messages = {
"auth/invalid-email":"Проверь адрес электронной почты.",
"auth/missing-password":"Введи пароль.",
"auth/weak-password":"Пароль должен содержать не менее 6 символов.",
"auth/email-already-in-use":"Этот адрес уже зарегистрирован.",
"auth/invalid-credential":"Неверная почта или пароль.",
"auth/user-not-found":"Аккаунт не найден.",
"auth/wrong-password":"Неверная почта или пароль.",
"auth/network-request-failed":"Нет соединения. Проверь интернет.",
"auth/operation-not-allowed":"Включи Email/Password в Firebase Authentication.",
"storage/unauthorized":"Нет доступа к фотографиям. Проверь правила Storage.",
"storage/bucket-not-found":"Firebase Storage ещё не настроен.",
"storage/unknown":"Ошибка загрузки фотографии.",
"permission-denied":"Нет доступа. Проверь правила Firebase."
};

return messages[error?.code] || error?.message || "Неизвестная ошибка.";
}

function setAuthButtons(disabled){
$("login").disabled = disabled;
$("register").disabled = disabled;
}


/* LOGIN */

$("login").addEventListener("click",async()=>{

showError("authError");

const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){
showError("authError","Введи почту и пароль.");
return;
}

setAuthButtons(true);

try{
await signInWithEmailAndPassword(auth,email,password);
}catch(error){
console.error(error);
showError("authError","Ошибка входа: "+friendlyError(error));
}finally{
setAuthButtons(false);
}

});


/* REGISTER */

$("register").addEventListener("click",async()=>{

showError("authError");

const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){
showError("authError","Введи почту и пароль.");
return;
}

if(password.length<6){
showError("authError","Пароль должен содержать не менее 6 символов.");
return;
}

setAuthButtons(true);

try{
await createUserWithEmailAndPassword(auth,email,password);
}catch(error){
console.error(error);
showError("authError","Ошибка регистрации: "+friendlyError(error));
}finally{
setAuthButtons(false);
}

});


$("password").addEventListener("keydown",event=>{
if(event.key==="Enter") $("login").click();
});


/* LOGOUT */

$("logout").addEventListener("click",async()=>{
try{
await signOut(auth);
}catch(error){
showError("chatError",friendlyError(error));
}
});


/* EMOJI */

function drawEmojiPicker(){

$("emojiPicker").replaceChildren();

emojis.forEach(emoji=>{

const button = document.createElement("button");
button.type = "button";
button.textContent = emoji;
button.title = "Выбрать аватар";

button.addEventListener("click",()=>{
selectedEmoji = emoji;
$("myAvatar").textContent = emoji;
});

$("emojiPicker").appendChild(button);

});

}

drawEmojiPicker();


/* PROFILE */

$("saveProfile").addEventListener("click",async()=>{

if(!currentUser) return;

showError("profileError");

const name = $("myName").value.trim().slice(0,30);

if(!name){
showError("profileError","Введи имя.");
return;
}

try{

myProfile = {name,avatar:selectedEmoji};

await set(ref(rtdb,"profiles/"+currentUser.uid),{
name,
avatar:selectedEmoji,
email:currentUser.email || ""
});

$("myAvatar").textContent = selectedEmoji;
$("myName").value = name;

}catch(error){
console.error(error);
showError("profileError",friendlyError(error));
}

});


/* PEOPLE */

function drawPeople(){

const root = $("people");
root.replaceChildren();

const groupButton = document.createElement("button");
groupButton.type = "button";
groupButton.className = "person";
groupButton.innerHTML = '<span class="avatar">🌐</span><span>Общий чат</span>';

groupButton.addEventListener("click",()=>openChat(null));
root.appendChild(groupButton);

const others = Object.entries(profiles).filter(([uid])=>uid!==currentUser?.uid);

if(!others.length){
const empty = document.createElement("p");
empty.className = "muted";
empty.textContent = "Пока других пользователей нет.";
root.appendChild(empty);
}

others.forEach(([uid,profile])=>{

const button = document.createElement("button");
button.type = "button";
button.className = "person";

const avatar = document.createElement("span");
avatar.className = "avatar";
avatar.textContent = profile.avatar || "🙂";

const info = document.createElement("span");
info.style.minWidth = "0";

const name = document.createElement("span");
name.textContent = profile.name || "Пользователь";

const status = document.createElement("span");
status.className = "status";
status.style.display = "block";
status.textContent = profile.online ? "В сети" : "Не в сети";

info.append(name,status);
button.append(avatar,info);

button.addEventListener("click",()=>openChat(uid));

root.appendChild(button);

});

}


/* CHAT */

function openChat(uid){

selectedUser = uid;

$("chatTitle").textContent = uid ? (profiles[uid]?.name || "Личный чат") : "Общий чат";
$("chatAvatar").textContent = uid ? (profiles[uid]?.avatar || "🙂") : "🌐";
$("chatSubtitle").textContent = uid ? "Личные сообщения" : "Сообщения для всех";

showError("chatError");

if(stopMessages) stopMessages();

$("messages").replaceChildren();

const messagesRef = collection(db,"messages");
const q = query(messagesRef,orderBy("createdAt","asc"),limit(100));

stopMessages = onSnapshot(q,snapshot=>{

const root = $("messages");
root.replaceChildren();

const docs = snapshot.docs.filter(doc=>{

const data = doc.data();

if(!uid) return !data.to;

return (
(data.uid===currentUser.uid && data.to===uid) ||
(data.uid===uid && data.to===currentUser.uid)
);

});

if(!docs.length){

const empty = document.createElement("p");
empty.className = "muted";
empty.textContent = "Сообщений пока нет. Напиши первым!";
root.appendChild(empty);

}

docs.forEach(doc=>{

const data = doc.data();

const item = document.createElement("div");
item.className = "message"+(data.uid===currentUser.uid?" mine":"");

const meta = document.createElement("small");

meta.textContent = (data.name || "Пользователь")+" · "+
(data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString() : "сейчас");

const body = document.createElement("div");

if(data.text){
const text = document.createElement("div");
text.textContent = data.text;
body.appendChild(text);
}

if(data.imageUrl){

const img = document.createElement("img");
img.src = data.imageUrl;
img.alt = "Фотография";
img.loading = "lazy";

img.addEventListener("click",()=>{
$("viewerImage").src = data.imageUrl;
$("photoViewer").classList.add("active");
});

body.appendChild(img);

}

item.append(meta,body);
root.appendChild(item);

});

root.scrollTop = root.scrollHeight;

},error=>{
console.error(error);
showError("chatError","Не удалось загрузить сообщения: "+friendlyError(error));
});

}


/* PHOTO PREVIEW */

$("photoInput").addEventListener("change",()=>{

const file = $("photoInput").files[0];

if(!file){
$("photoPreview").classList.add("hidden");
return;
}

if(!file.type.startsWith("image/")){
showError("chatError","Выбери изображение.");
$("photoInput").value = "";
return;
}

if(file.size>10*1024*1024){
showError("chatError","Фотография должна быть меньше 10 МБ.");
$("photoInput").value = "";
$("photoPreview").classList.add("hidden");
return;
}

$("photoPreview").src = URL.createObjectURL(file);
$("photoPreview").classList.remove("hidden");
showError("chatError");

});


/* PHOTO VIEWER */

$("closeViewer").addEventListener("click",()=>{
$("photoViewer").classList.remove("active");
$("viewerImage").src = "";
});

$("photoViewer").addEventListener("click",event=>{
if(event.target===$("photoViewer")){
$("photoViewer").classList.remove("active");
$("viewerImage").src = "";
}
});


/* SEND MESSAGE AND PHOTO */

$("composer").addEventListener("submit",async event=>{

event.preventDefault();

if(!currentUser) return;

const text = $("messageInput").value.trim();
const file = $("photoInput").files[0];

if(!text && !file) return;

if(file && !file.type.startsWith("image/")){
showError("chatError","Выбери изображение.");
return;
}

if(file && file.size>10*1024*1024){
showError("chatError","Фотография должна быть меньше 10 МБ.");
return;
}

$("send").disabled = true;
showError("chatError");

try{

const message = {
uid:currentUser.uid,
name:myProfile.name || currentUser.email || "Пользователь",
createdAt:serverTimestamp()
};

if(text){
message.text = text;
}

if(file){

showError("chatError","Загружаю фотографию...");

const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

const path = "chatPhotos/"+currentUser.uid+"/"+Date.now()+"_"+safeName;

const photoRef = storageRef(storage,path);

await uploadBytes(photoRef,file,{
contentType:file.type
});

message.imageUrl = await getDownloadURL(photoRef);

}

if(selectedUser){
message.to = selectedUser;
}

await addDoc(collection(db,"messages"),message);

$("messageInput").value = "";
$("photoInput").value = "";
$("photoPreview").src = "";
$("photoPreview").classList.add("hidden");

showError("chatError");

}catch(error){

console.error(error);
showError("chatError","Ошибка отправки: "+friendlyError(error));

}finally{

$("send").disabled = false;

}

});


/* USER SESSION */

async function startUser(user){

currentUser = user;

$("authPanel").classList.add("hidden");
$("messenger").classList.remove("hidden");

$("myEmail").textContent = user.email || "";

if(stopProfiles) stopProfiles();
if(stopPresence) stopPresence();

if(stopMessages){
stopMessages();
stopMessages = null;
}

const profileRef = ref(rtdb,"profiles/"+user.uid);

stopProfiles = onValue(ref(rtdb,"profiles"),snapshot=>{

profiles = snapshot.val() || {};

const mine = profiles[user.uid];

if(mine){

myProfile = {
name:mine.name || "",
avatar:mine.avatar || "🙂"
};

$("myName").value = myProfile.name;
selectedEmoji = myProfile.avatar;
$("myAvatar").textContent = selectedEmoji;

}else{

myProfile = {
name:user.email?.split("@")[0] || "Пользователь",
avatar:"🙂"
};

$("myName").value = myProfile.name;
$("myAvatar").textContent = myProfile.avatar;

}

drawPeople();

if(selectedUser && !profiles[selectedUser]){
openChat(null);
}else{

$("chatTitle").textContent = selectedUser
? (profiles[selectedUser]?.name || "Личный чат")
: "Общий чат";

$("chatAvatar").textContent = selectedUser
? (profiles[selectedUser]?.avatar || "🙂")
: "🌐";

}

},error=>{
showError("profileError","Ошибка профилей: "+friendlyError(error));
});


try{

const existingProfile = await new Promise((resolve,reject)=>{

let unsubscribe;

unsubscribe = onValue(profileRef,snapshot=>{
unsubscribe();
resolve(snapshot.val());
},error=>{
if(unsubscribe) unsubscribe();
reject(error);
},{onlyOnce:true});

});

if(!existingProfile){

await set(profileRef,{
name:myProfile.name,
avatar:myProfile.avatar,
email:user.email || ""
});

}

const statusRef = ref(rtdb,"status/"+user.uid);

await onDisconnect(statusRef).set({
online:false,
lastChanged:rtdbTimestamp()
});

await set(statusRef,{
online:true,
lastChanged:rtdbTimestamp()
});

if(stopPresence) stopPresence();

stopPresence = onValue(ref(rtdb,"status"),snapshot=>{

const statuses = snapshot.val() || {};

Object.keys(profiles).forEach(uid=>{
profiles[uid].online = Boolean(statuses[uid]?.online);
});

drawPeople();

});

}catch(error){

console.error(error);
showError("profileError","Ошибка подключения: "+friendlyError(error));

}

openChat(null);

}


/* AUTH STATE */

onAuthStateChanged(auth,user=>{

if(user){

startUser(user);

}else{

currentUser = null;
selectedUser = null;
profiles = {};

if(stopMessages) stopMessages();
if(stopProfiles) stopProfiles();
if(stopPresence) stopPresence();

stopMessages = null;
stopProfiles = null;
stopPresence = null;

$("messenger").classList.add("hidden");
$("authPanel").classList.remove("hidden");

}

});


window.addEventListener("unhandledrejection",event=>{
  console.error("Необработанная ошибка:",event.reason);
});

</script>
</body>
</html>
