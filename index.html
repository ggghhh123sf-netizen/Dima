<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Dima Messenger</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#1a2540;--blue:#397bff;--text:#f1f5ff;--muted:#91a0bd;--border:#293653;--green:#39df9a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17264a,var(--bg) 55%);color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;border-radius:12px;padding:11px 14px}
button:disabled{opacity:.55;cursor:wait}
input{min-width:0;width:100%;padding:12px;border-radius:12px;background:#0d1528;color:white;border:1px solid var(--border)}
.primary{background:linear-gradient(135deg,#4d8cff,#2861e8);color:white;font-weight:650}
.secondary{background:var(--panel2);color:white;border:1px solid var(--border)}
.danger{background:#512637;color:#ffdce5}
.app{max-width:1100px;margin:auto;padding:18px}
.panel{background:rgba(18,26,45,.96);border:1px solid var(--border);border-radius:18px;padding:18px}
.hidden{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3,p{margin-top:0}
.auth{max-width:420px;margin:8vh auto}
.auth input{margin:6px 0 12px}
.auth-actions{display:flex;gap:10px}
.auth-actions button{flex:1}
.error{color:#ff9da8;margin-top:12px;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);color:white;border:1px solid var(--border)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#263759;font-size:23px;flex-shrink:0}
.status{font-size:12px;color:var(--green)}
.chat{display:flex;flex-direction:column;min-height:65vh}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.messages{flex:1;min-height:250px;max-height:55vh;overflow-y:auto;padding:14px 0;display:flex;flex-direction:column;gap:10px}
.message{max-width:85%;padding:10px 13px;border-radius:14px;background:var(--panel2);overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:#2453a7}
.message small{display:block;color:#c1cce2;font-size:11px;margin-bottom:4px}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.composer input{flex:1}
.profile{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#emojiPicker{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#emojiPicker button{font-size:23px;padding:6px;background:var(--panel2)}
@media(max-width:680px){
.app{padding:10px}
.layout{grid-template-columns:1fr}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.person{padding:8px}
.person .avatar{width:34px;height:34px;font-size:19px}
.chat{min-height:55vh}
.messages{max-height:45vh}
.top{align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <section id="authPanel" class="panel auth">
    <h1>Dima Messenger</h1>
    <p class="muted">Войди или создай аккаунт</p>
    <label for="email">Электронная почта</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Не менее 6 символов">
    <div class="auth-actions">
      <button id="login" type="button" class="primary">Войти</button>
      <button id="register" type="button" class="secondary">Регистрация</button>
    </div>
    <div id="authError" class="error"></div>
  </section>

  <section id="messenger" class="hidden">
    <header class="top">
      <div>
        <h1>Dima Messenger</h1>
        <div class="muted">Твой чат</div>
      </div>
      <button id="logout" type="button" class="secondary">Выйти</button>
    </header>

    <div class="layout">
      <aside class="panel">
        <h2>Профиль</h2>
        <div class="profile">
          <div id="myAvatar" class="avatar">🙂</div>
          <div style="min-width:0;flex:1">
            <input id="myName" maxlength="30" placeholder="Твоё имя">
            <div id="myEmail" class="muted" style="font-size:12px;margin-top:6px;overflow-wrap:anywhere"></div>
          </div>
        </div>
        <div id="emojiPicker"></div>
        <button id="saveProfile" type="button" class="primary">Сохранить профиль</button>
        <div id="profileError" class="error"></div>
        <hr style="border-color:var(--border);margin:18px 0">
        <h2>Люди</h2>
        <div id="people" class="people">
          <p class="muted">Загрузка пользователей…</p>
        </div>
      </aside>

      <main class="panel chat">
        <div class="chat-head">
          <div id="chatAvatar" class="avatar">🌐</div>
          <div>
            <h2 id="chatTitle" style="margin-bottom:3px">Общий чат</h2>
            <div id="chatSubtitle" class="muted">Сообщения для всех</div>
          </div>
        </div>
        <div id="messages" class="messages">
          <p class="muted">Загрузка сообщений…</p>
        </div>
        <div id="chatError" class="error"></div>
        <form id="composer" class="composer">
          <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Напиши сообщение…">
          <button id="send" type="submit" class="primary">Отправить</button>
        </form>
      </main>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect,
  remove,
  serverTimestamp as rtdbTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

/*
  ВАЖНО:
  Вставь сюда свой настоящий Firebase config из Firebase Console.
  Не используй значения-примеры.
*/
const firebaseConfig = {
  apiKey: "ВСТАВЬ_API_KEY",
  authDomain: "dima-messenger.firebaseapp.com",
  databaseURL: "https://dima-messenger-default-rtdb.firebaseio.com",
  projectId: "dima-messenger",
  storageBucket: "dima-messenger.firebasestorage.app",
  messagingSenderId: "ВСТАВЬ_MESSAGING_SENDER_ID",
  appId: "ВСТАВЬ_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

const $ = id => document.getElementById(id);
const emojis = ["🙂","😎","🐱","🐸","🦊","🐼","👻","🤖","🐺","🔥","⭐","💎"];
let currentUser = null;
let myProfile = {name:"",avatar:"🙂"};
let selectedUser = null;
let profiles = {};
let stopMessages = null;
let stopProfiles = null;
let stopPresence = null;
let selectedEmoji = "🙂";

function showError(id, message="") {
  $(id).textContent = message;
}

function safeText(value) {
  return String(value ?? "");
}

function setAuthButtons(disabled) {
  $("login").disabled = disabled;
  $("register").disabled = disabled;
}

function friendlyError(error) {
  const messages = {
    "auth/invalid-email":"Проверь адрес электронной почты.",
    "auth/missing-password":"Введи пароль.",
    "auth/weak-password":"Пароль должен содержать не менее 6 символов.",
    "auth/email-already-in-use":"Этот адрес уже зарегистрирован.",
    "auth/invalid-credential":"Неверная почта или пароль.",
    "auth/user-not-found":"Аккаунт не найден.",
    "auth/wrong-password":"Неверная почта или пароль.",
    "auth/network-request-failed":"Нет соединения. Проверь интернет.",
    "permission-denied":"Нет доступа. Проверь правила Firebase."
  };
  return messages[error?.code] || error?.message || "Неизвестная ошибка.";
}

$("login").addEventListener("click", async () => {
  showError("authError");
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    showError("authError","Введи почту и пароль.");
    return;
  }
  setAuthButtons(true);
  try {
    await signInWithEmailAndPassword(auth,email,password);
  } catch (error) {
    showError("authError","Вход: " + friendlyError(error));
  } finally {
    setAuthButtons(false);
  }
});

$("register").addEventListener("click", async () => {
  showError("authError");
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    showError("authError","Введи почту и пароль.");
    return;
  }
  if (password.length < 6) {
    showError("authError","Пароль должен содержать не менее 6 символов.");
    return;
  }
  setAuthButtons(true);
  try {
    await createUserWithEmailAndPassword(auth,email,password);
  } catch (error) {
    showError("authError","Регистрация: " + friendlyError(error));
  } finally {
    setAuthButtons(false);
  }
});

$("password").addEventListener("keydown", event => {
  if (event.key === "Enter") $("login").click();
});

$("logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    showError("chatError",friendlyError(error));
  }
});

function drawEmojiPicker() {
  $("emojiPicker").replaceChildren();
  emojis.forEach(emoji => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = emoji;
    button.title = "Выбрать аватар";
    button.addEventListener("click", () => {
      selectedEmoji = emoji;
      $("myAvatar").textContent = emoji;
    });
    $("emojiPicker").appendChild(button);
  });
}

drawEmojiPicker();

$("saveProfile").addEventListener("click", async () => {
  if (!currentUser) return;
  showError("profileError");
  const name = $("myName").value.trim().slice(0,30);
  if (!name) {
    showError("profileError","Введи имя.");
    return;
  }
  try {
    myProfile = {name,avatar:selectedEmoji};
    await set(ref(rtdb,"profiles/" + currentUser.uid),{
      name,
      avatar:selectedEmoji,
      email:currentUser.email || ""
    });
    $("myAvatar").textContent = selectedEmoji;
    $("myName").value = name;
  } catch (error) {
    showError("profileError",friendlyError(error));
  }
});

function drawPeople() {
  const root = $("people");
  root.replaceChildren();

  const groupButton = document.createElement("button");
  groupButton.type = "button";
  groupButton.className = "person";
  groupButton.innerHTML = '<span class="avatar">🌐</span><span>Общий чат</span>';
  groupButton.addEventListener("click", () => openChat(null));
  root.appendChild(groupButton);

  const others = Object.entries(profiles).filter(([uid]) => uid !== currentUser?.uid);
  if (!others.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "Пока других пользователей нет.";
    root.appendChild(empty);
  }

  others.forEach(([uid,profile]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "person";

    const avatar = document.createElement("span");
    avatar.className = "avatar";
    avatar.textContent = profile.avatar || "🙂";

    const info = document.createElement("span");
    info.style.minWidth = "0";
    const name = document.createElement("span");
    name.textContent = profile.name || "Пользователь";
    const status = document.createElement("span");
    status.className = "status";
    status.style.display = "block";
    status.textContent = profile.online ? "В сети" : "Не в сети";

    info.append(name,status);
    button.append(avatar,info);
    button.addEventListener("click", () => openChat(uid));
    root.appendChild(button);
  });
}

function openChat(uid) {
  selectedUser = uid;
  $("chatTitle").textContent = uid ? (profiles[uid]?.name || "Личный чат") : "Общий чат";
  $("chatAvatar").textContent = uid ? (profiles[uid]?.avatar || "🙂") : "🌐";
  $("chatSubtitle").textContent = uid ? "Личные сообщения" : "Сообщения для всех";
  showError("chatError");

  if (stopMessages) stopMessages();

  $("messages").replaceChildren();
  const messagesRef = collection(db,"messages");
  const q = query(messagesRef,orderBy("createdAt","asc"),limit(100));

  stopMessages = onSnapshot(q, snapshot => {
    const root = $("messages");
    root.replaceChildren();

    const docs = snapshot.docs.filter(doc => {
      const data = doc.data();
      if (!uid) return !data.to;
      return (data.uid === currentUser.uid && data.to === uid) ||
             (data.uid === uid && data.to === currentUser.uid);
    });

    if (!docs.length) {
      const empty = document.createElement("p");
      empty.className = "muted";
      empty.textContent = "Сообщений пока нет. Напиши первым!";
      root.appendChild(empty);
    }

    docs.forEach(doc => {
      const data = doc.data();
      const item = document.createElement("div");
      item.className = "message" + (data.uid === currentUser.uid ? " mine" : "");

      const meta = document.createElement("small");
      meta.textContent = (data.name || "Пользователь") + " · " +
        (data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString() : "сейчас");

      const body = document.createElement("div");
      body.textContent = safeText(data.text);

      item.append(meta,body);
      root.appendChild(item);
    });
    root.scrollTop = root.scrollHeight;
  }, error => {
    showError("chatError","Не удалось загрузить сообщения: " + friendlyError(error));
  });
}

$("composer").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return;

  const text = $("messageInput").value.trim();
  if (!text) return;

  $("send").disabled = true;
  showError("chatError");

  try {
    const message = {
      text,
      uid: currentUser.uid,
      name: myProfile.name || currentUser.email || "Пользователь",
      createdAt: serverTimestamp()
    };
    if (selectedUser) message.to = selectedUser;

    await addDoc(collection(db,"messages"),message);
    $("messageInput").value = "";
  } catch (error) {
    showError("chatError","Не удалось отправить: " + friendlyError(error));
  } finally {
    $("send").disabled = false;
  }
});

async function startUser(user) {
  currentUser = user;
  $("authPanel").classList.add("hidden");
  $("messenger").classList.remove("hidden");
  $("myEmail").textContent = user.email || "";

  if (stopProfiles) stopProfiles();
  if (stopPresence) stopPresence();
  if (stopMessages) {
    stopMessages();
    stopMessages = null;
  }

  const profileRef = ref(rtdb,"profiles/" + user.uid);
  stopProfiles = onValue(ref(rtdb,"profiles"), snapshot => {
    profiles = snapshot.val() || {};
    const mine = profiles[user.uid];

    if (mine) {
      myProfile = {
        name: mine.name || "",
        avatar: mine.avatar || "🙂"
      };
      $("myName").value = myProfile.name;
      selectedEmoji = myProfile.avatar;
      $("myAvatar").textContent = selectedEmoji;
    } else {
      myProfile = {
        name: user.email?.split("@")[0] || "Пользователь",
        avatar: "🙂"
      };
      $("myName").value = myProfile.name;
      $("myAvatar").textContent = myProfile.avatar;
    }

    drawPeople();

    if (selectedUser && !profiles[selectedUser]) {
      openChat(null);
    } else {
      $("chatTitle").textContent = selectedUser
        ? (profiles[selectedUser]?.name || "Личный чат")
        : "Общий чат";
      $("chatAvatar").textContent = selectedUser
        ? (profiles[selectedUser]?.avatar || "🙂")
        : "🌐";
    }
  }, error => {
    showError("profileError","Ошибка профилей: " + friendlyError(error));
  });

  try {
    await set(profileRef,{
      name: myProfile.name || user.email?.split("@")[0] || "Пользователь",
      avatar: myProfile.avatar || "🙂",
      email: user.email || ""
    });

    const statusRef = ref(rtdb,"status/" + user.uid);
    await onDisconnect(statusRef).set({
      online:false,
      lastChanged:rtdbTimestamp()
    });

    await set(statusRef,{
      online:true,
      lastChanged:rtdbTimestamp()
    });

    if (stopPresence) stopPresence();
    stopPresence = onValue(ref(rtdb,"status"), snapshot => {
      const statuses = snapshot.val() || {};
      Object.keys(profiles).forEach(uid => {
        profiles[uid].online = Boolean(statuses[uid]?.online);
      });
      drawPeople();
    });
  } catch (error) {
    showError("profileError","Ошибка подключения: " + friendlyError(error));
  }

  openChat(null);
}

onAuthStateChanged(auth, user => {
  if (user) {
    startUser(user);
  } else {
    currentUser = null;
    selectedUser = null;
    profiles = {};
    if (stopMessages) stopMessages();
    if (stopProfiles) stopProfiles();
    if (stopPresence) stopPresence();
    stopMessages = stopProfiles = stopPresence = null;
    $("messenger").classList.add("hidden");
    $("authPanel").classList.remove("hidden");
  }
});

window.addEventListener("unhandledrejection", event => {
  console.error("Необработанная ошибка:",event.reason);
});
</script>
</body>
</html>
