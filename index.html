<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dima messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px Arial;background:#dce6ed;color:#17212b}
.app{max-width:800px;height:100dvh;margin:auto;background:white;display:flex;flex-direction:column}
header{background:#527da3;color:white;padding:16px;font-size:21px;font-weight:bold}
#auth{padding:20px}
input,button{font:inherit;padding:12px;border-radius:9px}
input{border:1px solid #bbb;width:100%;margin:7px 0}
button{border:0;background:#527da3;color:white;cursor:pointer;margin:5px 0}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{background:#eee;padding:10px;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.mine{background:#d7f5d7;align-self:flex-end}
.who{font-size:12px;color:#527da3;font-weight:bold}
.time{font-size:11px;color:#777;text-align:right;margin-top:5px}
#sendform{display:flex;padding:8px;gap:5px}
#text{flex:1;min-width:0}
#status{font-size:13px;color:#b33;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
<header>✉ Dima messenger <button id="logout" style="float:right;display:none">Выйти</button></header>

<section id="auth">
<h2 id="heading">Вход</h2>
<form id="authform">
<input id="name" placeholder="Твоё имя" maxlength="32" style="display:none">
<input id="email" type="email" placeholder="Электронная почта" required>
<input id="password" type="password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
<button id="submit" type="submit">Войти</button>
</form>
<button id="switch">Создать аккаунт</button>
<p id="status"></p>
</section>

<section id="chat">
<div id="messages">Загрузка сообщений…</div>
<form id="sendform">
<input id="text" placeholder="Сообщение…" maxlength="1000" required>
<button type="submit">➤</button>
</form>
</section>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 onAuthStateChanged,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
 getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDpm_WzeaUue17urrQptihWbQQtWEOBp3U",
 authDomain:"dima-messenger.firebaseapp.com",
 projectId:"dima-messenger",
 storageBucket:"dima-messenger.firebasestorage.app",
 messagingSenderId:"205525066127",
 appId:"1:205525066127:web:b44470d06e4e5ccb21abfa",
 measurementId:"G-8HP9CRT76R"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let register=false;
let stopChat=null;

$("switch").onclick=()=>{
 register=!register;
 $("heading").textContent=register?"Регистрация":"Вход";
 $("name").style.display=register?"block":"none";
 $("submit").textContent=register?"Зарегистрироваться":"Войти";
 $("switch").textContent=register?"Уже есть аккаунт? Войти":"Создать аккаунт";
 $("status").textContent="";
};

$("authform").onsubmit=async e=>{
 e.preventDefault();
 $("status").textContent="";
 $("submit").disabled=true;
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(register){
   const name=$("name").value.trim();
   if(!name)throw Error("Напиши своё имя.");
   const result=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(result.user,{displayName:name});
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(err){
  const errors={
   "auth/email-already-in-use":"Эта почта уже зарегистрирована.",
   "auth/invalid-email":"Проверь адрес почты.",
   "auth/weak-password":"Пароль должен быть не короче 6 символов.",
   "auth/invalid-credential":"Неверная почта или пароль.",
   "auth/network-request-failed":"Проверь интернет."
  };
  $("status").textContent=errors[err.code]||err.message;
 }finally{
  $("submit").disabled=false;
 }
};

$("logout").onclick=()=>signOut(auth);

function showMessages(snapshot,user){
 const box=$("messages");
 const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
 box.replaceChildren();
 if(snapshot.empty){
  box.textContent="Сообщений пока нет. Напиши первым!";
  return;
 }
 snapshot.forEach(doc=>{
  const m=doc.data();
  const item=document.createElement("div");
  item.className="msg"+(m.uid===user.uid?" mine":"");
  const who=document.createElement("div");
  who.className="who";
  who.textContent=m.uid===user.uid?"Ты":(m.name||"Пользователь");
  const body=document.createElement("div");
  body.textContent=m.text||"";
  const time=document.createElement("div");
  time.className="time";
  time.textContent=m.createdAt?.toDate
   ?m.createdAt.toDate().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})
   :"сейчас";
  item.append(who,body,time);
  box.append(item);
 });
 if(nearBottom)box.scrollTop=box.scrollHeight;
}

onAuthStateChanged(auth,user=>{
 if(stopChat){stopChat();stopChat=null}
 $("auth").style.display=user?"none":"block";
 $("chat").style.display=user?"flex":"none";
 $("logout").style.display=user?"inline-block":"none";
 if(!user)return;

 const q=query(collection(db,"messages"),orderBy("createdAt","asc"),limit(200));
 stopChat=onSnapshot(q,snapshot=>showMessages(snapshot,user),err=>{
  $("messages").textContent="Ошибка базы: "+err.message;
 });
});

$("sendform").onsubmit=async e=>{
 e.preventDefault();
 const user=auth.currentUser;
 const text=$("text").value.trim();
 if(!user||!text)return;
 try{
  await addDoc(collection(db,"messages"),{
   text:text,
   uid:user.uid,
   name:user.displayName||user.email,
   createdAt:serverTimestamp()
  });
  $("text").value="";
 }catch(err){
  alert("Не удалось отправить сообщение: "+err.message);
 }
};
</script>
</body>
</html>
