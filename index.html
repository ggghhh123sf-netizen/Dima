
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17212b">
<title>Мой чат</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0e1621;
  color:#fff;
  height:100dvh;
  display:flex;
  flex-direction:column;
}
header{
  background:#17212b;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 5px #0003;
  z-index:1;
}
.avatar{
  width:45px;height:45px;
  border-radius:50%;
  background:#3390ec;
  display:grid;
  place-items:center;
  font-size:23px;
  flex-shrink:0;
}
.headtext{flex:1;min-width:0}
.name{font-size:18px;font-weight:bold}
.status{font-size:13px;color:#8eabbf;margin-top:4px}
#messages{
  flex:1;
  overflow-y:auto;
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:
    radial-gradient(circle at 20% 30%,#172536 0,transparent 40%),
    #0e1621;
}
.welcome{
  text-align:center;
  color:#a9bac8;
  font-size:13px;
  margin:8px auto 14px;
  background:#182533;
  padding:7px 12px;
  border-radius:12px;
}
.msg{
  max-width:85%;
  align-self:flex-end;
  background:#2b5278;
  padding:9px 11px 6px;
  border-radius:14px 14px 4px 14px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  box-shadow:0 1px 2px #0002;
}
.msg .time{
  font-size:11px;
  color:#c1d7e8;
  text-align:right;
  margin-top:5px;
}
.empty{
  text-align:center;
  color:#8eabbf;
  margin:auto;
  line-height:1.6;
}
footer{
  background:#17212b;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
}
#message{
  flex:1;
  min-width:0;
  max-height:120px;
  resize:none;
  border:0;
  outline:none;
  border-radius:22px;
  padding:13px 16px;
  font:16px Arial,sans-serif;
  color:#fff;
  background:#242f3d;
}
#message::placeholder{color:#8e9eaf}
button{
  width:48px;height:48px;
  border:0;border-radius:50%;
  background:#3390ec;color:white;
  font-size:21px;
  flex-shrink:0;
  cursor:pointer;
}
button:active{transform:scale(.94)}
.bottom{
  text-align:center;
  color:#6f879b;
  font-size:11px;
  padding:0 0 6px;
  background:#17212b;
}
</style>
</head>
<body>
<header>
  <div class="avatar">✉</div>
  <div class="headtext">
    <div class="name">Мой чат</div>
    <div class="status">личные сообщения</div>
  </div>
  <div style="font-size:23px">⋮</div>
</header>

<main id="messages">
  <div class="welcome">Добро пожаловать в Мой чат!</div>
</main>

<footer>
  <textarea id="message" rows="1"
    placeholder="Сообщение..." maxlength="2000"></textarea>
  <button id="send" aria-label="Отправить">➤</button>
</footer>
<div class="bottom">Мой чат · версия 2.0</div>

<script>
const messages = document.querySelector("#messages");
const input = document.querySelector("#message");
const send = document.querySelector("#send");
const KEY = "my-chat-messages-v2";

let history = [];
try {
  history = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

function render() {
  messages.querySelectorAll(".msg,.empty").forEach(el => el.remove());

  if (history.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Здесь пока пусто. Напиши первое сообщение 👋";
    messages.appendChild(empty);
  }

  history.forEach(item => {
    const bubble = document.createElement("div");
    bubble.className = "msg";

    const text = document.createElement("div");
    text.textContent = item.text;

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = item.time;

    bubble.append(text, time);
    messages.appendChild(bubble);
  });

  messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const now = new Date();
  history.push({
    text,
    time: now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    })
  });

  try {
    localStorage.setItem(KEY, JSON.stringify(history));
  } catch {}

  input.value = "";
  input.style.height = "auto";
  render();
  input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

render();
</script>
</body>
</html>
