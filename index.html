
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Dima Messenger</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#1a2540;--blue:#397bff;--text:#f1f5ff;--muted:#91a0bd;--border:#293653;--green:#39df9a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17264a,var(--bg) 55%);color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer;border-radius:12px;padding:11px 14px}input{min-width:0;width:100%;padding:12px;border-radius:12px;background:#0d1528;color:white;border:1px solid var(--border)}
.primary{background:linear-gradient(135deg,#4d8cff,#2861e8);color:white;font-weight:650}.secondary{background:var(--panel2);color:white;border:1px solid var(--border)}.danger{background:#512637;color:#ffdce5}
.app{max-width:1050px;margin:auto;padding:16px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#5794ff,#6548dc)}
h1{font-size:21px;margin:0}.subtitle,.muted{color:var(--muted);font-size:12px;margin-top:4px}.badge{background:#15233a;border-radius:20px;padding:8px 11px;font-size:12px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}.panel{background:#121a2df5;border:1px solid var(--border);border-radius:18px;overflow:hidden}.sidebar{padding:15px}.section-title{font-size:12px;color:var(--muted);margin:4px 0 12px}
.profile-card{background:var(--panel2);border-radius:14px;padding:12px;margin-bottom:20px}.profile-head{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;font-size:24px;background:#273a62}.big{width:52px;height:52px;font-size:29px}.profile-name{font-weight:700;overflow-wrap:anywhere}.profile-edit{display:flex;gap:6px;margin-top:12px}.profile-edit button{padding:9px}
#emojis{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}#emojis button{background:#263553;color:white;font-size:20px;padding:5px;width:35px;height:35px}
#people{display:flex;flex-direction:column;gap:7px}.person{display:flex;align-items:center;gap:9px;padding:9px;background:#111b2e;border-radius:12px}.person .avatar{width:36px;height:36px;font-size:20px}.person-info{min-width:0}.person-name{font-size:13px;overflow-wrap:anywhere}.person-state{font-size:11px;color:var(--green)}.offline{color:var(--muted)!important}
.chat-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.chat-title{font-weight:750}.chat-status{font-size:12px;color:var(--green);margin-top:4px}
#messages{height:min(57vh,570px);min-height:300px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:15px}.empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:90%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}.msg .avatar{width:34px;height:34px;font-size:19px}.msg-content{min-width:0}.msg-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:0 4px 5px}.msg.mine .msg-meta{justify-content:flex-end}.msg-name{color:#a8c7ff;font-weight:700}
.bubble{padding:10px 13px;border-radius:16px 16px 16px 5px;background:#202d48;border:1px solid #2b3a59;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.mine .bubble{background:linear-gradient(135deg,#397bff,#285ed8);border-radius:16px 16px 5px 16px}
.delete-message{margin-top:5px;padding:5px 8px;font-size:11px;background:#512637;color:#ffdce5}
#typing{display:none;padding:0 16px 9px;color:var(--muted);font-size:12px}.composer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;background:#0f1729}.composer input{flex:1;background:#18233a}#send{color:white;background:#397bff}
.error{display:none;background:#482431;border:1px solid #744052;color:#ffd8e2;border-radius:12px;padding:11px;margin-bottom:12px;overflow-wrap:anywhere}
.auth-wrap{max-width:430px;margin:8vh auto;padding:23px}.auth-wrap h2{margin:0}.auth-wrap p{color:var(--muted);font-size:14px;line-height:1.6}.auth-fields{display:grid;gap:10px;margin:18px 0 12px}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#auth,#chat{display:block}.footer-note{text-align:center;color:#7484a2;font-size:11px;padding:12px}
@media(max-width:700px){.app{padding:10px}.layout{grid-template-columns:1fr}.sidebar{padding:12px}.profile-card{margin-bottom:14px}.people-list{flex-direction:row!important;overflow-x:auto}.person{min-width:150px}#messages{height:48vh;min-height:260px;padding:12px 9px}.msg{max-width:96%;gap:5px}.msg .avatar{width:29px;height:29px;font-size:17px}.chat-head{padding:13px}.composer{padding:9px}.badge{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">✉</div><div><h1>Dima Messenger</h1><div class="subtitle">Твой личный чат</div></div></div>
 <div class="badge">● Онлайн-чат</div>
</header>
<div id="error" class="error"></div>
<section id="auth" class="auth-wrap panel">
 <h2>С возвращением 👋</h2><p>Войди в аккаунт или создай новый.</p>
 <div class="auth-fields"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль"></div>
 <div class="auth-actions"><button id="login" class="primary">Войти</button><button id="register" class="secondary">Регистрация</button></div>
</section>
<section id="chat">
<div class="layout">
<aside class="panel sidebar">
 <h3 class="section-title">Твой профиль</h3>
 <div class="profile-card">
  <div class="profile-head"><div id="myavatar" class="avatar big">😀</div><div><div id="myname" class="profile-name">Пользователь</div><div class="muted">● Ты в сети</div></div></div>
  <div class="profile-edit"><input id="newname" maxlength="30" placeholder="Твоё имя"><button id="saveprofile" class="primary">Сохранить</button></div>
  <div class="muted" style="margin-top:12px">Выбери аватарку</div><div id="emojis"></div>
 </div>
 <h3 class="section-title">Пользователи</h3><div id="people" class="people-list">Загрузка...</div>
 <button id="logout" class="secondary danger" style="width:100%;margin-top:16px">Выйти из аккаунта</button>
</aside>
<section class="panel">
 <div class="chat-head"><div><div class="chat-title">💬 Общий чат</div><div class="chat-status">● Сообщения в реальном времени</div></div><div class="badge">🔒</div></div>
 <div id="messages"><div class="empty">Загрузка переписки...</div></div><div id="typing" aria-live="polite"></div>
 <form id="composer" class="composer"><input id="message" maxlength="1000" autocomplete="off" placeholder="Напиши сообщение..."><button id="send" type="submit">➤</button></form>
</section>
</div><div class="footer-note">Dima Messenger · оставайся на связи</div>
</section>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import{getDatabase,ref,set,get,onValue,onDisconnect,remove,serverTimestamp as rtdbTimestamp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDpm_WzeaUue17urrQptihWbQQtWEOBp3U",
 authDomain:"dima-messenger.firebaseapp.com",
 projectId:"dima-messenger",
 storageBucket:"dima-messenger.firebasestorage.app",
 messagingSenderId:"205525066127",
 appId:"1:205525066127:web:b44470d06e4e5ccb21abfa",
 measurementId:"G-8HP9CRT76R",
 databaseURL:"https://dima-messenger-default-rtdb.firebaseio.com"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),realtime=getDatabase(app);
const $=id=>document.getElementById(id);
const emojiList=["😀","😎","🐱","🐸","👻","🤖","🎮","⭐","🔥","🦊","🐼","💀","🐺","🦄","🚀","🍀"];
let user=null,myProfile={name:"",avatar:"😀"},profiles={},statuses={},typingUsers={},cachedMessages=[];
let stops=[],myTypingRef=null,typingTimer=null,authGeneration=0;

function showError(s){$("error").textContent=s;$("error").style.display="block"}
function clearError(){$("error").textContent="";$("error").style.display="none"}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stopListeners(){stops.forEach(fn=>fn());stops=[];clearTimeout(typingTimer);if(myTypingRef)remove(myTypingRef).catch(()=>{});myTypingRef=null;typingUsers={}}
function renderTyping(){
 const names=Object.entries(typingUsers).filter(([id,d])=>id!==user?.uid&&d?.typing&&Date.now()-(d.updatedAt||0)<6000).map(([id])=>profiles[id]?.name||"Кто-то");
 $("typing").textContent=names.length?names.join(", ")+(names.length===1?" печатает…":" печатают…"):"";
 $("typing").style.display=names.length?"block":"none";
}
function setTyping(active){if(!user||!myTypingRef)return;set(myTypingRef,{typing:active,updatedAt:Date.now()}).catch(e=>console.error(e))}
function renderPeople(){
 const people=Object.entries(profiles).sort((a,b)=>(statuses[a[0]]?.state==="online"?0:1)-(statuses[b[0]]?.state==="online"?0:1));
 $("people").innerHTML=people.length?people.map(([id,p])=>`<div class="person"><div class="avatar">${safe(p.avatar||"😀")}</div><div class="person-info"><div class="person-name">${safe(p.name||"Пользователь")}${id===user?.uid?" (ты)":""}</div><div class="person-state ${statuses[id]?.state==="online"?"":"offline"}">${statuses[id]?.state==="online"?"● В сети":"○ Не в сети"}</div></div></div>`).join(""):'<div class="muted">Пока нет пользователей</div>';
}
function renderMessages(){
 const box=$("messages"),near=box.scrollHeight-box.scrollTop-box.clientHeight<100;
 if(!cachedMessages.length){box.innerHTML='<div class="empty">✨ Здесь пока тихо.<br>Отправь первое сообщение!</div>';return}
 box.innerHTML=cachedMessages.map(m=>{
  const mine=m.uid===user?.uid,p=profiles[m.uid]||{name:m.name||"Пользователь",avatar:"😀"};
  const time=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="msg ${mine?"mine":""}"><div class="avatar">${safe(p.avatar||"😀")}</div><div class="msg-content"><div class="msg-meta"><span class="msg-name">${safe(p.name||m.name||"Пользователь")}</span><span>${safe(time)}</span></div><div class="bubble">${safe(m.text||"")}</div><button type="button" class="delete-message" data-delete="${safe(m.id)}">🗑️ Удалить</button></div></div>`;
 }).join("");
 if(near)box.scrollTop=box.scrollHeight;
}
$("emojis").innerHTML=emojiList.map(e=>`<button type="button" data-emoji="${e}">${e}</button>`).join("");
$("emojis").addEventListener("click",async e=>{const a=e.target.dataset.emoji;if(!a||!user)return;myProfile={...myProfile,avatar:a};$("myavatar").textContent=a;try{await set(ref(realtime,"profiles/"+user.uid),myProfile);clearError()}catch(x){showError("Ошибка аватарки: "+x.message)}});
$("register").onclick=async()=>{clearError();try{await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){showError("Регистрация: "+e.message)}};
$("login").onclick=async()=>{clearError();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){showError("Вход: "+e.message)}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login").click()});
$("saveprofile").onclick=async()=>{if(!user)return;const name=$("newname").value.trim().slice(0,30);if(!name){showError("Введи имя.");return}myProfile={...myProfile,name};$("myname").textContent=name;try{await set(ref(realtime,"profiles/"+user.uid),myProfile);clearError()}catch(e){showError("Ошибка профиля: "+e.message)}};
$("logout").onclick=async()=>{try{if(user){await remove(ref(realtime,"typing/"+user.uid));await set(ref(realtime,"status/"+user.uid),{state:"offline",last_changed:rtdbTimestamp()})}await signOut(auth)}catch(e){showError("Ошибка выхода: "+e.message)}};
$("message").addEventListener("input",()=>{if(!user||!myTypingRef)return;clearTimeout(typingTimer);const active=!!$("message").value.trim();setTyping(active);if(active)typingTimer=setTimeout(()=>setTyping(false),2500)});

$("messages").addEventListener("click",async e=>{
 const button=e.target.closest("[data-delete]");if(!button||!user)return;
 if(!confirm("Удалить это сообщение у всех участников общего чата?"))return;
 button.disabled=true;
 try{await deleteDoc(doc(db,"messages",button.dataset.delete));clearError()}
 catch(err){showError("Не удалось удалить сообщение: "+err.message);button.disabled=false}
});

$("composer").addEventListener("submit",async e=>{
 e.preventDefault();if(!user){showError("Сначала войди.");return}
 const text=$("message").value.trim();if(!text)return;
 $("send").disabled=true;
 try{await addDoc(collection(db,"messages"),{text,uid:user.uid,name:myProfile.name||user.email||"Пользователь",createdAt:serverTimestamp()});$("message").value="";setTyping(false);clearError()}
 catch(err){showError("Не удалось отправить сообщение: "+err.message)}
 finally{$("send").disabled=false;$("message").focus()}
});

onAuthStateChanged(auth,async current=>{
 const gen=++authGeneration;stopListeners();user=current;cachedMessages=[];profiles={};statuses={};
 $("auth").style.display=user?"none":"block";$("chat").style.display=user?"block":"none";$("messages").innerHTML="";$("people").innerHTML="";clearError();
 if(!user)return;
 try{
  const uid=user.uid,pr=ref(realtime,"profiles/"+uid),snap=await get(pr);if(gen!==authGeneration)return;
  myProfile=snap.exists()?{name:"",avatar:"😀",...snap.val()}:{name:user.email?.split("@")[0]||"Пользователь",avatar:"😀"};
  await set(pr,myProfile);if(gen!==authGeneration)return;
  $("myname").textContent=myProfile.name;$("myavatar").textContent=myProfile.avatar||"😀";$("newname").value=myProfile.name||"";
  stops.push(onValue(ref(realtime,"profiles"),s=>{profiles=s.val()||{};renderPeople();renderMessages();renderTyping()},e=>showError("Ошибка профилей: "+e.message)));
  stops.push(onValue(ref(realtime,"status"),s=>{statuses=s.val()||{};renderPeople()},e=>showError("Ошибка статусов: "+e.message)));
  const presence=ref(realtime,"status/"+uid);
  stops.push(onValue(ref(realtime,".info/connected"),async s=>{if(s.val()!==true||gen!==authGeneration||!user)return;try{await onDisconnect(presence).set({state:"offline",last_changed:rtdbTimestamp()});if(gen!==authGeneration)return;await set(presence,{state:"online",last_changed:rtdbTimestamp()})}catch(e){showError("Ошибка статуса: "+e.message)}}));
  myTypingRef=ref(realtime,"typing/"+uid);await onDisconnect(myTypingRef).remove();
  stops.push(onValue(ref(realtime,"typing"),s=>{if(gen!==authGeneration)return;typingUsers=s.val()||{};renderTyping()},e=>showError("Ошибка печати: "+e.message)));
  const q=query(collection(db,"messages"),orderBy("createdAt","asc"),limit(200));
  stops.push(onSnapshot(q,s=>{if(gen!==authGeneration)return;cachedMessages=s.docs.map(d=>({id:d.id,...d.data()}));renderMessages()},e=>showError("Ошибка сообщений: "+e.message)));
 }catch(e){if(gen===authGeneration)showError("Ошибка запуска чата: "+e.message)}
});
</script>
</body>
</html>
